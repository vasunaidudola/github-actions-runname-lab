name: Build and Deploy Feature Branch

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Select deployment region'
        required: true
        type: choice
        options:
          - preprod-east
          - preprod-west
          - prod-east
          - prod-west

  pull_request:

run-name: >
  ${{ github.event_name == 'workflow_dispatch'
      && format('Deploy Release tag {0} to {1}', github.ref_name, inputs.region)
      || format('Build and Deploy Feature Branch {0}', github.head_ref) }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Demo step
        run: echo "Workflow executed successfully"
